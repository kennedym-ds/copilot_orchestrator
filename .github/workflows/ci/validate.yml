name: Validation Suite

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  tooling:
    name: Run Copilot validation toolkit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Copilot assets
        run: .\scripts\validate-copilot-assets.ps1 -RepositoryRoot .

      - name: Check prompt metadata
        run: .\scripts\add-prompt-metadata.ps1 -RepositoryRoot . -CheckOnly

      - name: Run Markdown lint checks
        run: .\scripts\run-lint.ps1 -RepositoryRoot .

      - name: Run repository smoke tests
        run: .\scripts\run-smoke-tests.ps1 -RepositoryRoot .

      - name: Generate token budget report
        run: |
          if (-not (Test-Path -LiteralPath artifacts)) {
            New-Item -ItemType Directory -Path artifacts | Out-Null
          }
          .\scripts\token-report.ps1 -Path . -OutputPath artifacts\token-report.json -ConfigPath token-thresholds.json

      - name: Upload token report
        uses: actions/upload-artifact@v4
        with:
          name: token-report
          path: artifacts/token-report.json
          retention-days: 5

      - name: Install Pester
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run PowerShell tests
        run: Invoke-Pester -Path tests

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest tests/mcp/ -v

      # -------------------------------------------------------------------
      # Headless Copilot reviewer step (Phase 3 row 3.6)
      # Runs `copilot chat --agent reviewer -p` against the PR diff.
      # Exit 10 signals HIGH+ findings; CI flags but does not fail hard.
      # Skipped automatically if COPILOT_TOKEN is not provisioned.
      # -------------------------------------------------------------------
      - name: Copilot headless reviewer (best-effort)
        id: copilot-headless-review
        if: ${{ github.event_name == 'pull_request' && env.COPILOT_TOKEN != '' }}
        continue-on-error: true
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          COPILOT_HEADLESS: '1'
          COPILOT_HEADLESS_MAX_TIER: STANDARD
        run: |
          if (-not (Get-Command copilot -ErrorAction SilentlyContinue)) {
            Write-Host "copilot CLI not available on runner; skipping."
            exit 0
          }
          $diff = git diff --name-only origin/${{ github.base_ref }}...HEAD
          $prompt = "Review changes on this PR. Report HIGH/MEDIUM/LOW findings with confidence scores. Files: `n$diff"
          copilot chat --agent reviewer -p $prompt
          $code = $LASTEXITCODE
          if ($code -eq 10) {
            Write-Host "::warning::Reviewer reported HIGH+ findings (exit 10). Human attention required."
          } elseif ($code -ne 0) {
            Write-Host "::error::Reviewer exited with unexpected code $code"
            exit $code
          }
