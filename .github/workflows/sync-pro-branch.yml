name: Sync pro branch with enterprise

# Trigger on pushes to enterprise. The pro branch targets Copilot Pro and Student
# plans where Claude Opus/Sonnet 4.6 and GPT-5.4 are NOT available. We substitute
# all Anthropic premium/execution models and GPT-5.4 with GPT-5.3-Codex (1x).
# Haiku 4.5 (0.33x) remains on the Pro tier.

on:
  push:
    branches:
      - enterprise
    paths:
      - '.github/agents/**'
      - '.github/prompts/**'
      - '.github/skills/**'
      - 'instructions/**'
      - '.claude/**'
      - 'docs/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'INSTRUCTION_CHANGELOG.md'
      - 'README.md'
      - 'llms.txt'
      - '.copilot-review-instructions.md'
  workflow_dispatch:

jobs:
  sync-pro:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout enterprise
        uses: actions/checkout@v4
        with:
          ref: enterprise
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Reset pro to enterprise
        run: git checkout -B pro origin/enterprise

      - name: Apply Pro plan model substitutions
        shell: bash
        run: |
          # Pro/Student plan mapping (models NOT on Pro -> Pro-available):
          #   Claude Opus 4.7 (Pro+/Business/Ent) -> GPT-5.3-Codex (1x)
          #   Claude Opus 4.6 (Ent only)          -> GPT-5.3-Codex (1x)
          #   Claude Sonnet 4.6 (Pro+ and above)  -> GPT-5.3-Codex (1x)
          #   GPT-5.4 (Pro+ and above)            -> GPT-5.4 mini (0.33x)
          # Unchanged (available on Pro):
          #   GPT-5.3-Codex, GPT-5.4 mini, Claude Haiku 4.5, Gemini 3.1 Pro

          DIRS=".github/agents .github/prompts .github/skills instructions .claude docs"

          apply_replacements() {
            local file="$1"
            # Opus 4.7 first (before generic Opus), then 4.6
            sed -i 's/Claude Opus 4\.7 (copilot)/GPT-5.3-Codex (copilot)/g' "$file"
            sed -i 's/Claude Opus 4\.7/GPT-5.3-Codex/g' "$file"
            sed -i 's/Opus 4\.7/GPT-5.3-Codex/g' "$file"
            sed -i 's/Claude Opus 4\.6 (copilot)/GPT-5.3-Codex (copilot)/g' "$file"
            sed -i 's/Claude Opus 4\.6/GPT-5.3-Codex/g' "$file"
            sed -i 's/Opus 4\.6/GPT-5.3-Codex/g' "$file"
            # Sonnet 4.6
            sed -i 's/Claude Sonnet 4\.6 (copilot)/GPT-5.3-Codex (copilot)/g' "$file"
            sed -i 's/Claude Sonnet 4\.6/GPT-5.3-Codex/g' "$file"
            sed -i 's/Sonnet 4\.6/GPT-5.3-Codex/g' "$file"
            # GPT-5.4 mini must be handled BEFORE bare GPT-5.4 to avoid "GPT-5.4 mini mini"
            # (GPT-5.4 mini stays on Pro; no-op but we preserve it explicitly)
            sed -i 's/GPT-5\.4 mini (copilot)/__KEEP54MINI__ (copilot)/g' "$file"
            sed -i 's/GPT-5\.4 mini/__KEEP54MINI__/g' "$file"
            # Now map bare GPT-5.4 -> GPT-5.4 mini
            sed -i 's/GPT-5\.4 (copilot)/GPT-5.4 mini (copilot)/g' "$file"
            sed -i 's/GPT-5\.4/GPT-5.4 mini/g' "$file"
            # Restore the placeholder
            sed -i 's/__KEEP54MINI__/GPT-5.4 mini/g' "$file"
          }
          export -f apply_replacements

          for dir in $DIRS; do
            if [ -d "$dir" ]; then
              find "$dir" -type f \( -name "*.md" -o -name "*.py" \) -exec bash -c 'apply_replacements "$0"' {} \;
            fi
          done

          if [ -d "scripts" ]; then
            find scripts -type f \( -name "*.ps1" -o -name "*.sh" \) -exec bash -c 'apply_replacements "$0"' {} \;
          fi

          for file in README.md AGENTS.md INSTRUCTION_CHANGELOG.md llms.txt .copilot-review-instructions.md; do
            if [ -f "$file" ]; then
              apply_replacements "$file"
            fi
          done

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit substitutions
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git add -A
          git commit -m "chore: apply Pro plan model substitutions on pro branch" --no-verify

      - name: Push pro
        if: steps.check_changes.outputs.changes == 'true'
        run: git push --force-with-lease origin pro

      - name: Report status
        run: |
          if [ "${{ steps.check_changes.outputs.changes }}" == "true" ]; then
            echo "pro branch synced and updated"
          else
            echo "pro branch is in sync, no changes needed"
          fi
