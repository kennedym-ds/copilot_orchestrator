name: Sync low-cost branch with main

# Trigger on pushes to main, for any file in the copilot orchestrator scope
on:
  push:
    branches:
      - main
    # Only trigger if these paths change (skip pure GitHub/CI updates)
    paths:
      - '.github/agents/**'
      - '.github/prompts/**'
      - '.github/skills/**'
      - 'instructions/**'
      - '.claude/**'
      - 'docs/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'INSTRUCTION_CHANGELOG.md'
      - 'README.md'
      - 'llms.txt'
      - '.copilot-review-instructions.md'
  workflow_dispatch: # Allow manual triggers

jobs:
  sync-low-cost:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Reset low-cost to main
        run: |
          # Reset low-cost branch to match main exactly, then apply downgrades.
          # This avoids merge conflicts from model string changes that diverge
          # between branches on every sync.
          git checkout -B low-cost origin/main

      - name: Apply model downgrades
        shell: bash
        run: |
          # Downgrade mapping — Option B (64% cost reduction):
          #   GPT-5.4           → Claude Haiku 4.5   (22 execution agents)
          #   Claude Sonnet 4.6 → Claude Haiku 4.5   (1 agent: translation-conductor)
          #   Claude Opus 4.6   → Claude Sonnet 4.5  (3 premium agents)
          #   Claude Haiku 4.5  → Claude Haiku 4.5   (3 routine agents — no change)

          DIRS=".github/agents .github/prompts .github/skills instructions .claude docs"

          apply_replacements() {
            local file="$1"
            # Pass 1: GPT-5.4 → Claude Haiku 4.5 (execution tier)
            sed -i 's/GPT-5\.4 (copilot)/Claude Haiku 4.5 (copilot)/g' "$file"
            sed -i 's/GPT-5\.4/Claude Haiku 4.5/g' "$file"
            # Pass 2: Claude Sonnet 4.6 → Claude Haiku 4.5 (before Opus to avoid double-sub)
            sed -i 's/Claude Sonnet 4\.6 (copilot)/Claude Haiku 4.5 (copilot)/g' "$file"
            sed -i 's/Claude Sonnet 4\.6/Claude Haiku 4.5/g' "$file"
            sed -i 's/Sonnet 4\.6/Haiku 4.5/g' "$file"
            # Pass 3: Claude Opus 4.6 → Claude Sonnet 4.5 (premium → execution)
            sed -i 's/Claude Opus 4\.6 (copilot)/Claude Sonnet 4.5 (copilot)/g' "$file"
            sed -i 's/Claude Opus 4\.6/Claude Sonnet 4.5/g' "$file"
            sed -i 's/Opus 4\.6/Sonnet 4.5/g' "$file"
            # Claude Haiku 4.5 stays as-is (already budget tier)
          }
          export -f apply_replacements

          # Content directories (markdown and python)
          for dir in $DIRS; do
            if [ -d "$dir" ]; then
              find "$dir" -type f \( -name "*.md" -o -name "*.py" \) -exec bash -c 'apply_replacements "$0"' {} \;
            fi
          done

          # Scripts directory (PowerShell and shell)
          if [ -d "scripts" ]; then
            find scripts -type f \( -name "*.ps1" -o -name "*.sh" \) -exec bash -c 'apply_replacements "$0"' {} \;
          fi

          # Root-level files
          for file in README.md AGENTS.md INSTRUCTION_CHANGELOG.md llms.txt .copilot-review-instructions.md; do
            if [ -f "$file" ]; then
              apply_replacements "$file"
            fi
          done

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit downgrades
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git add -A
          git commit -m "chore: apply model tier downgrades on low-cost branch" \
            --no-verify

      - name: Push low-cost
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git push --force-with-lease origin low-cost

      - name: Report status
        run: |
          if [ "${{ steps.check_changes.outputs.changes }}" == "true" ]; then
            echo "✅ low-cost branch synced and updated"
          else
            echo "ℹ️ low-cost branch is in sync, no changes needed"
          fi
